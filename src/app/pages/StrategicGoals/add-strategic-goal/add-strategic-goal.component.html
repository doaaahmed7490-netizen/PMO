<div class="content-container mt-3">
  <h5>{{'إضافة مشروع' }}
  </h5>
  <hr/>
  <form [formGroup]="StrategicGoalsForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-sm-4">
        <!--Law number -->
        <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "إسم المشروع"  }}
            </h6>
          </label>
          <input
            type="text"
           
            formControlName="strategicGoal"
            nbInput
            shape="round"
            fullWidth
            id="strategicGoal"
          />
       
        </div>
          <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "كود المشروع"  }}
            </h6>
          </label>
          <input
            type="text"
           
            formControlName="projectCode"
            nbInput
            shape="round"
            fullWidth
            id="projectCode"
          />
       
        </div>
         <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "تصنيف المشروع"}}
            </h6>
          </label>
          <nb-select
            shape="round"
            fullWidth
            formControlName="categId"
          
          
          >
            <nb-option *ngFor="let e of this.options" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
         <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "نوع المشروع"}}
            </h6>
          </label>
          <nb-select
            shape="round"
            fullWidth
            formControlName="TypeId"
          
          
          >
            <nb-option *ngFor="let e of this.options1" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
         <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "وصف المشروع"  }}
            </h6>
          </label>
          <textarea
            type="text"
           
            formControlName="Desc"
            nbInput
            shape="round"
            fullWidth
            id="Desc"
          ></textarea>
       
        </div>
     
      </div>

      <div class="col-sm-4">
             <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "العميل"}}
            </h6>
          </label>
          <nb-select
            shape="round"
            fullWidth
            formControlName="custId"
          
          
          >
            <nb-option *ngFor="let e of this.custs" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
          <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "مدير المشروع"}}
            </h6>
          </label>
         <nb-select
            shape="round"
            fullWidth
            formControlName="empId"
          
          
          >
            <nb-option *ngFor="let e of this.emps" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
          
        <!--Message arabic -->
         <div class="form-group">
          <label for="ToDate" class="label">
            <h6>
              {{ "نوع التاريخ" }}
            </h6>
          </label>
          <br/>
        <input type="radio" name="DateType" value="Hijri" checked> هجري
<input type="radio" name="DateType" value="Miladi"> ميلادي

          <!-- <mat-error
            *ngIf="fc.toDate.touched && fc.toDate.hasError('required')"
          >
            {{ "End Date is Required" | translate }}
          </mat-error> -->
        </div>
        <br/>
          <div class="form-group">
          <label for="FromDate" class="label">
            <h6>
              {{ "تاريخ البدء"  }}
            </h6>
          </label>
          <input
            type="date"
            formControlName="fromDate"
            nbInput
            shape="round"
            fullWidth
            id="fromDate"
          />
          <!-- <mat-error
            *ngIf="fc.fromDate.touched && fc.fromDate.hasError('required')"
          >
            {{ "Start Date is Required" | translate }}
          </mat-error> -->
        </div>
      
        <!--categoryName    <label>نوع التاريخ</label><br>

<input type="radio" name="DateType" value="Hijri" checked> هجري
<input type="radio" name="DateType" value="Miladi"> ميلادي
-->

          <div class="form-group">
          <label for="ToDate" class="label">
            <h6>
              {{ "تاريخ الإنتهاء" }}
            </h6>
          </label>
          <input
            type="date"
            formControlName="toDate"
            nbInput
            shape="round"
            fullWidth
            id="toDate"
          />

          <!-- <mat-error
            *ngIf="fc.toDate.touched && fc.toDate.hasError('required')"
          >
            {{ "End Date is Required" | translate }}
          </mat-error> -->
        </div>
       <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "ميزانية المشروع" }}
            </h6>
          </label>
          <input
            type="number"
        
            formControlName="projectCost"
            nbInput
            shape="round"
            fullWidth
            id="projectCost"
          />
       
        </div>
        
      </div>
        <div class="col-sm-4">
             <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "التكلفة التقديرية" }}
            </h6>
          </label>
          <input
            type="number"
        
            formControlName="estimatedCost"
            nbInput
            shape="round"
            fullWidth
            id="estimatedCost"
          />
       
        </div> 
        <!--Message arabic -->
        <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'إسم الدولة'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="name"
          
          
          >
            <nb-option *ngFor="let e of this.Country" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
                       <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'المحافظة/المدينة'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="state"
          
          
          >
            <nb-option *ngFor="let e of this.State" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
                         <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'المنطقة/الحى'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="district"
          
          
          >
            <nb-option *ngFor="let e of this.Districts" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
       <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "العنوان التفصيلى" }}
            </h6>
          </label>
          <input
            type="number"
        
            formControlName="address"
            nbInput
            shape="round"
            fullWidth
            id="address"
          />
       
        </div>
        
      
        <div class="form-group">
          <label for="GoalDesc" class="label">
            <h6>
              {{ "ملاحظات"  }}
            </h6>
          </label>
          <textarea
            type="text"
            formControlName="goalDesc"
            nbInput
            shape="round"
            fullWidth
            id="goalDesc"
          >
          </textarea>
        </div>
      </div>
    </div>
    <div class="row mt-2" >
      <div class="col-md-2">
        <button
          class="special-button m-2 mt-4 w-100"
   type="submit"
       >
          {{ "حفظ"  }}
        </button>
      </div>
       <div class="col-md-2">
        <button
          class="special-button m-2 mt-4 w-100"
   type="button"    (click)="Close()"

       >
          {{ "إلغاء"}}
        </button>
      </div>
    </div>
  </form>
</div>
