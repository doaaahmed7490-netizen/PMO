<div class="content-container">
  <h2> {{'قائمة بيانات العملات '}}
  </h2>
   <hr />
  <button
    class="special-button mb-3"
    type="button"
    (click)="ShowAdd()"
  >
    {{ "إضافة بيانات تسعيرالعملات"  }}
  </button>
  <nb-card>
<table class="responsive-table">
  <thead>
    <tr>
      <th>من عملة</th>
      <th> إلى عملة</th>

      <th>سعر التحويل</th>
     <th> تاريخ التسعير</th>

      <th>التعديل</th>

      <th>الحذف</th>
    </tr>
    
  </thead>
  <tbody>
    <tr *ngFor="let row of this.tableData1">
      <td>{{ row.type }}</td>
      <td>{{ row.notes }}</td>
      <td>{{ row.price }}</td>
      <td>{{ row.date }}</td>

  
        <td class="actions">
        <button mat-icon-button color="primary" (click)="edit(row)">
          <mat-icon>edit</mat-icon>
        </button>
</td>
        <td class="actions">

        <button mat-icon-button color="warn" (click)="delete1(row)">
          <mat-icon>delete</mat-icon>
        </button>
        </td>
    </tr>
  </tbody>
</table>
    
  </nb-card>

</div>
