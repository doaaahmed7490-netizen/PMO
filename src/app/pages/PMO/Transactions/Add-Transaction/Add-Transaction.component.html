<div class="content-container mt-3">
  <h5>{{'إضافة بيانات معاملة' }}
  </h5>
  <hr/>
  <form [formGroup]="StrategicGoalsForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-sm-4">
        <!--Law number -->
        <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "رقم المعاملة"  }}
            </h6>
          </label>
          <input
            type="text"
           
            formControlName="TranNo"
            nbInput
            shape="round"
            fullWidth
            id="TranNo"
          />
       
        </div>
          <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "وصف المعاملة"  }}
            </h6>
          </label>
          <input
            type="text"
           
            formControlName="TranDesc"
            nbInput
            shape="round"
            fullWidth
            id="TranDesc"
          />
       
        </div>
         <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "تصنيف المعاملة"}}
            </h6>
          </label>
          <nb-select
            shape="round"
            fullWidth
            formControlName="categId"
          
          
          >
            <nb-option *ngFor="let e of this.options" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
         <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "نوع الجهة"}}
            </h6>
          </label>
        <label>
    <input type="radio" formControlName="agencyType" value="customer" /> عميل
  </label>
  <label>
    <input type="radio" formControlName="agencyType" value="Citizen" /> مواطن
  </label>
 <label>
    <input type="radio" formControlName="agencyType" value="agency" /> جهة حكومية/خاصة
  </label>
        </div>
              <div class="form-group">
      <!--     <label for="StrategicGoal" class="label">
            <h6>
              {{ "نوع الجهة"}}
            </h6>
          </label> -->
       <div *ngIf="isCustomer()">
    <label>العميل</label>
   <!--  <select formControlName="customerId">
      <option     shape="round"
            fullWidth *ngFor="let c of customers" [value]="c.id">{{ c.name }}</option>
    </select> -->

      <nb-select
            shape="round"
            fullWidth
            formControlName="customerId"
          
          
          >
            <nb-option *ngFor="let e of customers" [value]="e.id">
              {{ e.name }}</nb-option
            >
          </nb-select>
  </div>

  <!-- Agency / Citizen fields -->
  <div *ngIf="isCitizen()">
    <label>إسم المواطن</label>
    <input type="text"   nbInput shape="round"
            fullWidth  formControlName="citizenName" />

    <label>رقم الهوية</label>
    <input type="text"  nbInput  shape="round"
            fullWidth formControlName="nationalId" />
  </div>
   <div *ngIf="isAgency()">
    <label>إسم الجهة </label>
    <input type="text"   nbInput shape="round"
            fullWidth  formControlName="AgencyName" />

  
  </div>
        </div>
     
     
      </div>

      <div class="col-sm-4">
          
          <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "الموظف المسؤل"}}
            </h6>
          </label>
         <nb-select
        
            shape="round"
            fullWidth
            formControlName="empId"
          multiple
          
          >
            <nb-option *ngFor="let e of this.emps" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>

        </div>
          
        <!--Message arabic -->
         <div class="form-group">
         <!--  <label for="ToDate" class="label">
            <h6>
              {{ "نوع التاريخ" }}
            </h6>
          </label>
          <br/>
        <input type="radio" name="DateType" value="Hijri" checked> هجري
<input type="radio" name="DateType" value="Miladi"> ميلادي
 -->
   
        </div>
        <br/>
          <div class="form-group">
          <label for="FromDate" class="label">
            <h6>
              {{ "تاريخ البدء"  }}
            </h6>
          </label>
          <input
            type="date"
            formControlName="fromDate"
            nbInput
            shape="round"
            fullWidth
            id="fromDate"
          />
          <!-- <mat-error
            *ngIf="fc.fromDate.touched && fc.fromDate.hasError('required')"
          >
            {{ "Start Date is Required" | translate }}
          </mat-error> -->
        </div>
      
        <!--categoryName    <label>نوع التاريخ</label><br>

<input type="radio" name="DateType" value="Hijri" checked> هجري
<input type="radio" name="DateType" value="Miladi"> ميلادي
-->

          <div class="form-group">
          <label for="ToDate" class="label">
            <h6>
              {{ "تاريخ الإنتهاء" }}
            </h6>
          </label>
          <input
            type="date"
            formControlName="toDate"
            nbInput
            shape="round"
            fullWidth
            id="toDate"
          />

          <!-- <mat-error
            *ngIf="fc.toDate.touched && fc.toDate.hasError('required')"
          >
            {{ "End Date is Required" | translate }}
          </mat-error> -->
        </div>
       <div class="form-group">
          <label for="StrategicGoal" class="label">
            <h6>
              {{ "القيمة المالية" }}
            </h6>
          </label>
          <input
            type="number"
        
            formControlName="projectCost"
            nbInput
            shape="round"
            fullWidth
            id="projectCost"
          />
       
        </div>
        
      </div>
        <div class="col-sm-4">
           
        <!--Message arabic -->
        <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'إسم الدولة'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="name"
          
          
          >
            <nb-option *ngFor="let e of this.Country" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
                       <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'المحافظة/المدينة'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="state"
          
          
          >
            <nb-option *ngFor="let e of this.State" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
                         <div class="form-group">
                        <label for="DistrictName" class="label">
                            <h6>    {{'المنطقة/الحى'}}</h6>
                        </label>
                           <nb-select
            shape="round"
            fullWidth
            formControlName="district"
          
          
          >
            <nb-option *ngFor="let e of this.Districts" [value]="e.id">
              {{ e.label }}</nb-option
            >
          </nb-select>
                    </div>
    
      
        <div class="form-group">
          <label for="GoalDesc" class="label">
            <h6>
              {{ "ملاحظات"  }}
            </h6>
          </label>
          <textarea
            type="text"
            formControlName="goalDesc"
            nbInput
            shape="round"
            fullWidth
            id="goalDesc"
          >
          </textarea>
        </div>
      </div>
    </div>
    <div class="row mt-2" >
      <div class="col-md-2">
        <button
          class="special-button m-2 mt-4 w-100"
   type="submit"
       >
          {{ "حفظ"  }}
        </button>
      </div>
       <div class="col-md-2">
        <button
          class="special-button m-2 mt-4 w-100"
   type="button"    (click)="Close()"

       >
          {{ "إلغاء"}}
        </button>
      </div>
    </div>
  </form>
</div>
